name: Pixabay müzik testi
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in Gymnopedie%20No%201 Heartbreaking Sad%20Trio Lasting%20Hope Bittersweet Rains%20Will%20Fall Healing At%20Rest Long%20Road%20Ahead Wounded Dreams%20Become%20Real Memories Lightless%20Dawn Despair%20and%20Triumph Thatched%20Villagers Dark%20Times Reminiscence Sovereign%20Quarter Danse%20Morialta Peaceful%20Desolation Eternal%20Hope Night%20Vigil Lonely%20Day Tragic%20Ending; do
            curl -s -o /dev/null -w "%{http_code} %{size_download} $n\n" "https://incompetech.com/music/royalty-free/mp3-royaltyfree/$n.mp3"
          done
          curl -s "https://incompetech.com/music/royalty-free/music.html" | grep -oiE 'feel[^<]{0,80}' | head -40
