# Anlatıcı sesi seçimi: 1. bölümü farklı Gemini sesleriyle üretir (paylaşım YOK). Videolar bir ön sürüme konur.
name: Ses dene (paylaşım yok)

on:
  workflow_dispatch:
    inputs:
      sesler:
        description: "Denenecek Gemini sesleri (JSON liste)"
        default: '["Enceladus","Algenib","Iapetus","Orus"]'
      bolum:
        description: "Bölüm dosyası"
        default: "episodes/001_16-44.json"

permissions:
  contents: write

jobs:
  hazirla:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ses-dene-$(date +%m%d%H%M)"
          gh release create "$tag" --prerelease --title "Anlatıcı sesi denemesi" \
            --notes "Aynı bölüm, farklı anlatıcı sesleri. Beğendiğinin adını söyle." --repo "${{ github.repository }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  uret:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ses: ${{ fromJSON(inputs.sesler) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Kurulum
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libcairo2-dev pkg-config
          mkdir -p ~/.fonts && cp fonts/*.ttf ~/.fonts/ && fc-cache -f
          pip install -r requirements.txt
          pip install faster-whisper || true
      - name: Videoyu üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: ${{ matrix.ses }}
          GEMINI_DENEME: "1"
          TTS_ENGINE: gemini
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "from engine import render as R; R.render_episode('${{ inputs.bolum }}', 'ses_${{ matrix.ses }}.mp4', 'yok', workdir='build/x')"
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.hazirla.outputs.tag }}" "ses_${{ matrix.ses }}.mp4" --repo "${{ github.repository }}"
