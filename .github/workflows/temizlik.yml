# Ses testi ve önizleme için oluşturulan geçici sürümleri siler.
name: Temizlik

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - name: Geçici sürümleri sil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^(ses-testi|onizleme)' \
            | while read t; do gh release delete "$t" --cleanup-tag -y --repo "${{ github.repository }}"; echo "silindi: $t"; done || true
      - uses: actions/checkout@v4
      - name: Geçici dalları sil
        run: |
          git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -E '^(para-prototip|onizleme-)' \
            | while read b; do git push origin --delete "$b"; echo "dal silindi: $b"; done || true
