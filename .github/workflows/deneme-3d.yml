# 3D deneme: Blender ile kodla kurulan low-poly sahne, GitHub makinesinde render (paylaşım YOK)
name: 3D deneme
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        parca: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: |
          curl -sSL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar xJ -C ~
          ~/blender-4.2.3-linux-x64/blender --version | head -1
      - name: Render
        run: |
          P=${{ matrix.parca }}; A=$(( (P-1)*40+1 )); B=$(( P*40 ))
          mkdir -p out; /usr/bin/time -v ~/blender-4.2.3-linux-x64/blender -b -P deneme3d/sahne.py -- $PWD/out $A $B 2>&1 | grep -E "Fra:|Elapsed|Error" | tail -5
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: kare-${{ matrix.parca }}
          path: out/
  video:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: kareler
          merge-multiple: true
      - run: sudo apt-get install -y -q ffmpeg >/dev/null; ffmpeg -v error -framerate 30 -pattern_type glob -i 'kareler/f_*.png' -c:v libx264 -pix_fmt yuv420p -crf 20 deneme3d.mp4; ls -la deneme3d.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: deneme3d-video
          path: deneme3d.mp4
