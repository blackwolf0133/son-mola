# Hiçbir şey paylaşmadan hesap ve Reels istatistiklerini okur (Claude analizi için).
name: İstatistik

on:
  workflow_dispatch:

jobs:
  oku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: İstatistikleri oku
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MODE: ${{ vars.IG_MODE }}
        run: python tools/istatistik.py
