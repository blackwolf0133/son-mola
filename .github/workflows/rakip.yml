# Rakip/örnek hesap incelemesi: başka bir profesyonel hesabın herkese açık verilerini okur. Paylaşım YOK.
name: Rakip inceleme (salt okuma)
on:
  workflow_dispatch:
    inputs:
      hesap:
        description: "Instagram kullanıcı adı"
        required: true
jobs:
  oku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/rakip.py "${{ inputs.hesap }}"
