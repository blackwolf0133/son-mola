# Rakip/örnek hesap incelemesi: başka bir profesyonel hesabın herkese açık verilerini okur. Paylaşım YOK.
name: Rakip inceleme (salt okuma)
on:
  workflow_dispatch:
    inputs:
      hesap:
        description: "Instagram kullanıcı adı"
        required: true
      video:
        description: "En çok beğenilen kaç video Gemini ile izlensin (0 = sadece sayılar)"
        default: "0"
jobs:
  oku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/rakip.py "${{ inputs.hesap }}"
      - if: ${{ inputs.video != '0' }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python tools/rakip_video.py "${{ inputs.hesap }}" "${{ inputs.video }}"
